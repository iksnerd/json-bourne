# Hunt config for the fingerprint detector (docs/CONFIG.md, `type: fingerprint`).
#
# Listed after config/hunt.yaml in case.yaml. `commands` below says it answers
# `jb activity` and `jb actor status`, so neither needs --config:
#
#   jb activity --case examples/case
#
# The source must map its documents to the canonical HTTP fields: user_agent, path,
# status (plus client_ip and method when known). The default mapper keeps the whole
# _source as the event's fields, so an index that already uses those names works.

commands: [activity, actor]

sources:
  - type: kibana
    url: https://kibana.example.com
    api_key_env: JB_KIBANA_API_KEY
    index: logs-http-*

detectors:
  # The indicators are not here. They are the actor files in the case's actors
  # directory (paths.actors), named relative to it.
  - type: fingerprint
    actors: [example-actor.yaml]
    # Our own infrastructure: an event relayed by these is never a suspect. A CDN
    # edge address is not listed: an edge is not a client, and no address is used to
    # attribute anything.
    ignore_ips: [198.51.100.7, 198.51.100.64/28]

store:
  path: ""
