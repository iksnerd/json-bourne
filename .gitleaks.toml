# Extends the default ruleset. One scoped exception: a test that feeds the config
# loader a key-shaped string to prove it is refused as an environment-variable name.
[extend]
useDefault = true

[[allowlists]]
description = "negative test fixture: a pasted key must be refused"
paths = ['''internal/config/config_test\.go''']
regexes = ['''abc123SecretKey==''']

[[allowlists]]
description = "synthetic sentinel tokens in tests that prove a credential is never printed or stored"
paths = [
  '''cmd/jb/intel_test\.go''',
  '''jb/intel_test\.go''',
  '''^intel_test\.go''',  # the file's path before it moved to jb/ (history is scanned)
  '''internal/config/register_greynoise_test\.go''',
  '''internal/adapters/webhook/webhook_test\.go''',
  '''internal/casefile/actor_test\.go''',
]
